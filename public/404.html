    <script>
      // GitHub Pages SPA fallback: stash the requested URL, then load the app root.
      // Keep this in sync with vite base (default /personalWebsite/).
      var base = '/personalWebsite/';
      sessionStorage.redirect = location.href;
      location.replace(location.origin + base);
